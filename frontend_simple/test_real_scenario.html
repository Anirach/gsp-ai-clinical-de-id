<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Scenario Test - De-identification Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        textarea { min-height: 200px; }
        .debug-section { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .step { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Real Scenario Test: De-identification Display</h1>
        <p class="text-muted">This test simulates the exact user workflow to identify why results aren't displaying.</p>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5><i class="fas fa-edit"></i> Input Text</h5>
                    </div>
                    <div class="card-body">
                        <textarea class="form-control" id="inputText" 
                                  placeholder="Enter clinical text here...">คุณสมชาย วิทยาภูมิ โทรศัพท์ 089-123-4567 อีเมล somchai@hospital.co.th หมอสมชาย ให้ยา</textarea>
                        <br>
                        <button class="btn btn-warning" onclick="performDeidentification()">
                            <i class="fas fa-shield-alt"></i> De-Identify Text
                        </button>
                        <button class="btn btn-success" onclick="testDirectUpdate()">
                            <i class="fas fa-test"></i> Test Direct Update
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5><i class="fas fa-eye"></i> Output Results</h5>
                    </div>
                    <div class="card-body">
                        <label for="outputText" class="form-label">Processed Text</label>
                        <textarea class="form-control" id="outputText" 
                                  readonly placeholder="Processed text will appear here..."></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="debug-section">
            <h4>🔍 Debug Information</h4>
            <div id="debugInfo"></div>
            
            <h5>Step-by-step Test:</h5>
            <div class="step">
                <button class="btn btn-info btn-sm" onclick="step1()">Step 1: Check DOM Elements</button>
            </div>
            <div class="step">
                <button class="btn btn-info btn-sm" onclick="step2()">Step 2: Test Basic Assignment</button>
            </div>
            <div class="step">
                <button class="btn btn-info btn-sm" onclick="step3()">Step 3: Mock API Response</button>
            </div>
            <div class="step">
                <button class="btn btn-info btn-sm" onclick="step4()">Step 4: Real API Call</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'https://8000-igoy3cr883cnchk200st0-6532622b.e2b.dev';
        
        function log(message, type = 'info') {
            const debugInfo = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            const badge = type === 'error' ? 'danger' : (type === 'success' ? 'success' : 'info');
            debugInfo.innerHTML += `<div><span class="badge bg-${badge}">${timestamp}</span> ${message}</div>`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function step1() {
            log('=== STEP 1: DOM Element Check ===');
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            
            log(`Input element found: ${inputText !== null}`);
            log(`Output element found: ${outputText !== null}`);
            
            if (inputText) log(`Input value: "${inputText.value}"`);
            if (outputText) {
                log(`Output current value: "${outputText.value}"`);
                log(`Output placeholder: "${outputText.placeholder}"`);
                log(`Output readonly: ${outputText.readOnly}`);
            }
        }
        
        function step2() {
            log('=== STEP 2: Basic Assignment Test ===');
            const outputText = document.getElementById('outputText');
            
            if (!outputText) {
                log('ERROR: Output textarea not found!', 'error');
                return;
            }
            
            const testMessage = 'TEST SUCCESS: This is a test message in the output textarea!';
            log('Setting test message...');
            outputText.value = testMessage;
            
            setTimeout(() => {
                log(`Current output value after assignment: "${outputText.value}"`);
                log(`Value length: ${outputText.value.length}`);
                
                if (outputText.value === testMessage) {
                    log('✅ Basic assignment works correctly!', 'success');
                } else {
                    log('❌ Basic assignment failed!', 'error');
                }
            }, 100);
        }
        
        function step3() {
            log('=== STEP 3: Mock API Response Test ===');
            
            const mockApiResponse = {
                "job_id": "test_job_123",
                "status": "completed",
                "documents_processed": 1,
                "results": [
                    {
                        "document_id": "test_doc",
                        "original_length": 75,
                        "deidentified_text": "[PERSON_ABC123] โทรศัพท์ [PHONE_DEF456] อีเมล [EMAIL_GHI789] [PERSON_JKL012] ให้ยา",
                        "entities_detected": 4,
                        "transformations_applied": 4
                    }
                ]
            };
            
            log('Mock API response created');
            log('Calling displayDeidentificationResults...');
            displayDeidentificationResults(mockApiResponse);
        }
        
        async function step4() {
            log('=== STEP 4: Real API Call ===');
            await performDeidentification();
        }
        
        function testDirectUpdate() {
            log('Testing direct textarea update...');
            const outputText = document.getElementById('outputText');
            const timestamp = new Date().toLocaleTimeString();
            
            outputText.value = `Direct Update Test - ${timestamp}\n\nThis text was set directly without API call.\nIf you can see this, the textarea update mechanism works.`;
            log('Direct update completed');
        }
        
        async function performDeidentification() {
            const inputText = document.getElementById('inputText');
            const text = inputText.value.trim();
            
            if (!text) {
                log('No input text provided', 'error');
                return;
            }
            
            log('Starting real de-identification API call...');
            log(`Input text: "${text}"`);
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/jobs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsImV4cCI6MTcyNzc5ODQ4NH0.fake_token_for_demo`
                    },
                    body: JSON.stringify({
                        documents: [
                            {
                                content: text,
                                document_id: `real_test_${Date.now()}`,
                                metadata: { source: 'real_test', timestamp: new Date().toISOString() }
                            }
                        ],
                        policy_version: 'pdpa_v1.0',
                        linkage_domain: 'patient_id'
                    })
                });
                
                log(`API response status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log('✅ API call successful', 'success');
                    log(`Response data: ${JSON.stringify(data, null, 2)}`);
                    
                    displayDeidentificationResults(data);
                } else {
                    const errorText = await response.text();
                    log(`❌ API error: ${errorText}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        function displayDeidentificationResults(data) {
            log('=== displayDeidentificationResults called ===');
            log(`Data received: ${JSON.stringify(data, null, 2)}`);
            
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            
            // Debug element access
            log(`Input element: ${inputText ? 'Found' : 'NOT FOUND'}`);
            log(`Output element: ${outputText ? 'Found' : 'NOT FOUND'}`);
            
            if (!outputText) {
                log('❌ CRITICAL ERROR: Output textarea not found!', 'error');
                return;
            }
            
            if (!data || !data.results || data.results.length === 0) {
                log('❌ Invalid API data structure', 'error');
                return;
            }
            
            const result = data.results[0];
            log(`Result data: ${JSON.stringify(result, null, 2)}`);
            
            // Construct the output content exactly as the main app does
            const outputContent = `De-identification Results:\n\n` +
                `Job ID: ${data.job_id || 'N/A'}\n` +
                `Status: ${data.status || 'N/A'}\n` +
                `Original Length: ${result.original_length || 'N/A'} characters\n` +
                `Entities Detected: ${result.entities_detected || 0}\n` +
                `Transformations Applied: ${result.transformations_applied || 0}\n\n` +
                `ORIGINAL TEXT:\n${inputText ? inputText.value : 'N/A'}\n\n` +
                `DE-IDENTIFIED TEXT:\n${result.deidentified_text || 'No text available'}`;
            
            log(`Output content prepared (${outputContent.length} characters)`);
            log(`First 100 chars: "${outputContent.substring(0, 100)}..."`);
            
            // Set the value
            log('Setting outputText.value...');
            outputText.value = outputContent;
            
            // Verify it was set
            setTimeout(() => {
                log(`Output value after setting (${outputText.value.length} characters):`);
                log(`First 100 chars of actual value: "${outputText.value.substring(0, 100)}..."`);
                
                if (outputText.value.includes('De-identification Results:')) {
                    log('✅ SUCCESS: Results displayed correctly!', 'success');
                } else {
                    log('❌ FAILURE: Results not visible in textarea!', 'error');
                    log(`Actual textarea content: "${outputText.value}"`);
                }
            }, 100);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('Page loaded - ready for testing');
            step1(); // Auto-run element check
        });
    </script>
</body>
</html>
